name: Bug report
description: Report a problem using fictional or redacted data.
body:
  - type: markdown
    attributes:
      value: Do not attach real order PDFs, buyer addresses, config files, ledgers, or credentials. Use private security reporting for vulnerabilities.
  - type: input
    id: versions
    attributes:
      label: Release, macOS, browser and printer model
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected result
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Sanitized error code or result
